<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Encuesta de Satisfacción · Hesperia Playa el Agua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --sea:#0F4C4A;
  --sea-deep:#0A3634;
  --sand:#F0E6D2;
  --sand-light:#FBF7EE;
  --coral:#E8622C;
  --coral-dark:#C94E1E;
  --palm:#4C7A63;
  --palm-light:#8FAE6B;
  --gold:#D9A441;
  --ink:#173330;
  --foam:#FFFFFF;
  --line:rgba(15,76,74,0.14);
  --shadow:0 10px 30px rgba(10,54,52,0.12);
}
*{box-sizing:border-box;}
body{margin:0;padding:0;background:var(--sand-light);color:var(--ink);font-family:'Inter',sans-serif;}
.app{max-width:860px;margin:0 auto;min-height:100vh;background:var(--sand-light);position:relative;}

.wave{display:block;width:100%;height:14px;}
.wave path{fill:none;stroke-width:2.5;}

header.top{background:var(--sea);color:var(--foam);padding:22px 20px 0;position:relative;}
header.top .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;}
header.top .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.35rem;margin:0;letter-spacing:.2px;}
header.top .brand small{display:block;font-family:'Inter';font-weight:400;font-size:.72rem;opacity:.75;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;}
nav.tabs{display:flex;gap:4px;margin-top:18px;}
nav.tabs button{flex:1;background:transparent;border:none;color:rgba(255,255,255,.68);font-family:'Inter';font-weight:600;font-size:.86rem;padding:10px 6px 14px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;}
nav.tabs button.active{color:#fff;border-bottom:2px solid var(--coral);}
nav.tabs button:hover{color:#fff;}
.wave-under{width:100%;height:10px;color:var(--sand-light);}

main{padding:22px 20px 60px;}

.progress-wrap{margin-bottom:18px;}
.progress-track{height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--coral);border-radius:4px;transition:width .3s ease;}
.progress-label{font-family:'IBM Plex Mono';font-size:.72rem;color:var(--palm);margin-top:6px;letter-spacing:.05em;}

.step{display:none;}
.step.active{display:block;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.step-head{margin-bottom:18px;}
.step-head .eyebrow{font-family:'IBM Plex Mono';font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--coral);}
.step-head h2{font-family:'Fraunces',serif;font-size:1.6rem;margin:4px 0 2px;color:var(--sea-deep);}
.step-head p{margin:0;color:var(--palm);font-size:.88rem;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--sea-deep);margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-family:'Inter';font-size:.95rem;background:#fff;color:var(--ink);}
.field textarea{min-height:78px;resize:vertical;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:var(--coral);}
.field .hint{font-size:.72rem;color:var(--palm);margin-top:4px;}
.field.error input, .field.error textarea{border-color:var(--coral);}
.field .error-msg{font-size:.72rem;color:var(--coral);margin-top:4px;display:none;}
.field.error .error-msg{display:block;}

.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease;}
.qcard:hover{transform:translateY(-1px);box-shadow:0 12px 35px rgba(10,54,52,0.15);}
.qcard .qtitle{font-size:.95rem;font-weight:600;color:var(--sea-deep);}
.qcard .qtitle .en{font-weight:400;color:var(--palm);font-size:.78rem;}
.rate-row{display:flex;gap:6px;margin-top:10px;}
.rate-btn{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px 7px;cursor:pointer;text-align:center;transition:all .15s ease;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.rate-btn:active{transform:scale(0.95);}
.rate-btn .num{display:block;font-family:'IBM Plex Mono';font-weight:600;font-size:1.05rem;color:var(--ink);}
.rate-btn .lbl{display:block;font-size:.6rem;color:var(--palm);margin-top:2px;line-height:1.1;}
.rate-btn.sel-1{background:var(--palm);border-color:var(--palm);}
.rate-btn.sel-2{background:var(--palm-light);border-color:var(--palm-light);}
.rate-btn.sel-3{background:var(--gold);border-color:var(--gold);}
.rate-btn.sel-4{background:var(--coral);border-color:var(--coral);}
.rate-btn.sel-5{background:var(--coral-dark);border-color:var(--coral-dark);}
.rate-btn.selected .num, .rate-btn.selected .lbl{color:#fff;}

.choice-row{display:flex;gap:10px;margin-top:8px;}
.choice-btn{flex:1;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--sea-deep);transition:all .15s ease;min-height:44px;}
.choice-btn:active{transform:scale(0.97);}
.choice-btn.selected{background:var(--sea);border-color:var(--sea);color:#fff;}

.nav-buttons{display:flex;gap:10px;margin-top:26px;}
.btn{border:none;border-radius:10px;padding:13px 20px;font-family:'Inter';font-weight:700;font-size:.9rem;cursor:pointer;letter-spacing:.01em;transition:all .15s ease;min-height:44px;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--coral);color:#fff;flex:1;}
.btn-primary:hover{background:var(--coral-dark);}
.btn-ghost{background:transparent;color:var(--sea);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--sea);}
.btn-small{padding:8px 14px;font-size:.78rem;border-radius:8px;}

.thanks{text-align:center;padding:40px 10px;}
.thanks .wavefig{font-size:2.6rem;}
.thanks h2{font-family:'Fraunces',serif;font-size:1.7rem;color:var(--sea-deep);}
.thanks p{color:var(--palm);}

.pin-gate{max-width:320px;margin:60px auto;text-align:center;}
.pin-gate input{text-align:center;letter-spacing:.3em;font-family:'IBM Plex Mono';font-size:1.2rem;}

.subnav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.subnav button{background:#fff;border:1.5px solid var(--line);color:var(--sea-deep);font-weight:600;font-size:.8rem;padding:8px 14px;border-radius:20px;cursor:pointer;transition:all .15s ease;min-height:36px;}
.subnav button.active{background:var(--sea);border-color:var(--sea);color:#fff;}

.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filter-bar label{font-size:.78rem;font-weight:600;color:var(--sea-deep);}
.filter-bar select,.filter-bar input[type="date"]{padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font-family:'Inter';font-size:.82rem;background:#fff;color:var(--ink);}
.filter-bar select:focus,.filter-bar input[type="date"]:focus{outline:2px solid var(--coral);outline-offset:1px;}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 14px;box-shadow:var(--shadow);transition:transform .15s ease;}
.kpi:hover{transform:translateY(-2px);}
.kpi .kval{font-family:'IBM Plex Mono';font-weight:600;font-size:1.55rem;color:var(--sea-deep);}
.kpi .klbl{font-size:.7rem;color:var(--palm);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
.kpi .ktrend{font-size:.72rem;margin-top:6px;font-weight:600;}
.kpi .up{color:var(--palm);}
.kpi .down{color:var(--coral);}

.panel-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:var(--shadow);}
.panel-card h3{font-family:'Fraunces',serif;font-size:1.1rem;margin:0 0 12px;color:var(--sea-deep);}
.chart-wrap{position:relative;height:220px;}
.chart-wrap.tall{height:280px;}

.section-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px 2px;}
.section-toggle h3{margin:0;}
.section-toggle .arrow{transition:.2s;color:var(--coral);font-weight:700;}
.qgrid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:10px;}
@media(min-width:560px){.kpi-grid{grid-template-columns:repeat(4,1fr);} .qgrid{grid-template-columns:1fr 1fr;}}
.qchart-box{background:var(--sand-light);border-radius:10px;padding:10px;}
.qchart-box .qname{font-size:.76rem;font-weight:600;color:var(--sea-deep);margin-bottom:6px;}
.qchart-box .qname .en{font-weight:400;color:var(--palm);}
.qchart-box .chart-wrap{height:130px;}

table.data-table{width:100%;border-collapse:collapse;font-size:.78rem;}
table.data-table th{background:var(--sea);color:#fff;padding:8px 6px;text-align:left;position:sticky;top:0;font-weight:600;}
table.data-table td{padding:7px 6px;border-bottom:1px solid var(--line);}
table.data-table tr:nth-child(even){background:var(--sand-light);}
.table-scroll{overflow-x:auto;max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--palm);}
.empty-state .eicon{font-size:2rem;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--sea-deep);color:#fff;padding:11px 20px;border-radius:30px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.3s;pointer-events:none;}
.toast.show{opacity:1;transform:translate(-50%,-4px);}

.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.stat-item{background:var(--sand-light);border-radius:10px;padding:10px 14px;flex:1;min-width:120px;}
.stat-item .sval{font-family:'IBM Plex Mono';font-weight:600;font-size:1.1rem;color:var(--sea-deep);}
.stat-item .slbl{font-size:.68rem;color:var(--palm);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

@media(max-width:480px){
  header.top{padding:16px 14px 0;}
  header.top .brand h1{font-size:1.1rem;}
  header.top .brand small{font-size:.65rem;}
  nav.tabs button{font-size:.78rem;padding:8px 4px 12px;}
  main{padding:16px 14px 50px;}
  .step-head h2{font-size:1.3rem;}
  .qcard{padding:14px 12px 12px;}
  .rate-btn{padding:8px 2px 6px;min-height:48px;}
  .rate-btn .num{font-size:1.15rem;}
  .rate-btn .lbl{font-size:.55rem;}
  .choice-btn{padding:11px 8px;font-size:.82rem;}
  .btn{padding:12px 16px;font-size:.85rem;}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .kpi{padding:12px 10px;}
  .kpi .kval{font-size:1.2rem;}
  .panel-card{padding:14px;}
  .chart-wrap{height:180px;}
  .chart-wrap.tall{height:220px;}
  .filter-bar{flex-direction:column;align-items:stretch;}
  .toolbar{flex-direction:column;}
  .toolbar .btn{text-align:center;}
}
</style>
</head>
<body>
<div class="app" id="app">

<header class="top">
  <div class="brand">
    <div>
      <h1>Hesperia Playa el Agua</h1>
      <small>Encuesta de satisfacción</small>
    </div>
  </div>
  <nav class="tabs" id="mainTabs">
    <button data-tab="encuesta" class="active">Encuesta</button>
    <button data-tab="panel">Panel de gestión</button>
  </nav>
  <svg class="wave-under" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0 6 Q 12.5 0 25 6 T 50 6 T 75 6 T 100 6 T 125 6 T 150 6 T 175 6 T 200 6 V10 H0 Z" fill="currentColor"/></svg>
</header>

<main id="main">

  <section id="tab-encuesta">
    <div id="wizard"></div>
  </section>

  <section id="tab-panel" style="display:none;">

    <div id="pinGate" class="pin-gate">
      <p style="color:var(--palm);font-size:.85rem;">Este panel es para uso interno del hotel.</p>
      <div class="field"><input id="pinInput" type="password" inputmode="numeric" placeholder="PIN de acceso" maxlength="6" aria-label="PIN de acceso"></div>
      <button class="btn btn-primary" style="width:100%" onclick="checkPin()">Entrar</button>

    </div>

    <div id="panelContent" style="display:none;">
      <div class="subnav">
        <button data-sub="resumen" class="active">Resumen · KPI</button>
        <button data-sub="analisis">Análisis</button>
        <button data-sub="graficos">Gráficos por pregunta</button>
        <button data-sub="datos">Datos</button>
      </div>

      <div id="sub-resumen"></div>
      <div id="sub-analisis" style="display:none;"></div>
      <div id="sub-graficos" style="display:none;"></div>
      <div id="sub-datos" style="display:none;"></div>
    </div>
  </section>

</main>
</div>
<div class="toast" id="toast"></div>
<div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,54,52,0.5);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;padding:24px 32px;border-radius:16px;box-shadow:var(--shadow);text-align:center;">
    <div style="width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;"></div>
    <div style="font-size:.85rem;color:var(--sea-deep);font-weight:600;" id="loadingText">Cargando...</div>
  </div>
</div>
<style>
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;z-index:200;border-radius:2px;animation:confetti-fall linear forwards;pointer-events:none;}
@keyframes check-pop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.check-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:199;display:flex;align-items:center;justify-content:center;background:rgba(10,54,52,0.3);animation:fadein .3s ease;}
.check-overlay .check-circle{width:80px;height:80px;border-radius:50%;background:var(--palm);display:flex;align-items:center;justify-content:center;animation:check-pop .5s ease forwards;}
.check-overlay .check-circle svg{width:40px;height:40px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
@media(max-width:480px){
  .kpi-grid.kpi-compact .kpi{padding:8px;}
  .kpi-grid.kpi-compact .kpi .kval{font-size:.95rem;}
}
.chart-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,54,52,0.85);z-index:300;display:flex;align-items:center;justify-content:center;animation:fadein .2s ease;}
.chart-modal{background:#fff;border-radius:16px;padding:24px;max-width:500px;width:90%;max-height:85vh;position:relative;box-shadow:0 8px 32px rgba(0,0,0,0.3);}
.chart-modal-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink);padding:4px 8px;border-radius:6px;}
.chart-modal-close:hover{background:var(--sand-light);}
.chart-modal h3{margin:0 0 12px;font-family:Fraunces,serif;color:var(--sea-deep);font-size:1.1rem;padding-right:30px;}
.chart-modal canvas{max-height:70vh;}
.chart-wrap{cursor:pointer;transition:transform .15s ease;}
.chart-wrap:hover{transform:scale(1.02);}
@media print{
  .top,.subnav,.tabs,.filter-bar,.btn,.toolbar,.pin-gate{display:none!important;}
  .panel-card{break-inside:avoid;box-shadow:none;border:1px solid #ddd;}
  .app{padding:0;}
}
</style>

<script>
const SECTIONS = [
  {key:'recepcion', title:'Recepción', en:'Reception', icon:'🛎️',
    questions:[
      {code:'VG', es:'Valoración global', en:'Global evaluation'},
      {code:'AP', es:'Atención del personal', en:'Staff attention'},
      {code:'Es', es:'Eficiencia del servicio', en:'Efficiency of service'},
    ]},
  {key:'habitacion', title:'Habitación', en:'Room', icon:'🛏️',
    questions:[
      {code:'VH', es:'Valoración global', en:'Global evaluation'},
      {code:'C', es:'Confort', en:'Comfort'},
      {code:'EC', es:'Estado de conservación', en:'State of repair'},
      {code:'BA', es:'Baño', en:'Bathroom'},
      {code:'LI', es:'Limpieza', en:'Cleanliness'},
    ]},
  {key:'desayuno', title:'Desayuno', en:'Breakfast', icon:'🥐',
    questions:[
      {code:'VD', es:'Valoración global', en:'Global evaluation'},
      {code:'AT', es:'Atención del personal', en:'Staff attention'},
      {code:'BF', es:'Variedad del buffet', en:'Variety of buffet'},
      {code:'CP', es:'Calidad de los productos', en:'Quality of products'},
    ]},
  {key:'restaurante', title:'Restaurante', en:'Restaurant', icon:'🍽️',
    questions:[
      {code:'VR', es:'Valoración global', en:'Global evaluation'},
      {code:'AT', es:'Atención del personal', en:'Staff attention'},
      {code:'CC', es:'Calidad de la comida', en:'Quality of food'},
    ]},
  {key:'bar', title:'Bar - Cafetería', en:'Bar - Café', icon:'🍹',
    questions:[
      {code:'VB', es:'Valoración global', en:'Global evaluation'},
      {code:'AT', es:'Atención del personal', en:'Staff attention'},
      {code:'CP', es:'Calidad de los productos', en:'Quality of products'},
    ]},
  {key:'zonas', title:'Zonas Públicas', en:'Public areas', icon:'🏖️',
    questions:[
      {code:'VA', es:'Valoración global', en:'Global evaluation'},
      {code:'LIM', es:'Limpieza', en:'Cleanliness'},
      {code:'P', es:'Piscina', en:'Swimming pool'},
      {code:'EC', es:'Estado de conservación', en:'State of repair'},
    ]},
  {key:'animacion', title:'Animación', en:'Entertainment', icon:'🎉',
    questions:[
      {code:'Av', es:'Valoración global', en:'Global evaluation'},
    ]},
];
const RATE_LABELS = ['','Muy Bueno','Bueno','Regular','Deficiente','Muy deficiente'];
const RATE_LABELS_EN = ['','Excellent','Good','Average','Poor','Very poor'];
const STORAGE_KEY = 'hesperia-encuesta-respuestas';
const DRAFT_KEY = 'hesperia-encuesta-borrador';
const SHEETS_URL_KEY = 'hesperia-sheets-webapp-url';
const STAFF_PIN = '2026';
const DB_NAME = 'HesperiaEncuesta';
const DB_VERSION = 1;
const STORE_NAME = 'respuestas';

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function loadAllFromDB(){
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    return await new Promise((resolve) => {
      const result = [];
      const cursor = store.openCursor();
      cursor.onsuccess = (e) => {
        const c = e.target.result;
        if (c) { result.push(c.value); c.continue(); }
        else resolve(result);
      };
      cursor.onerror = () => resolve([]);
    });
  } catch(e){ return []; }
}

async function saveAllToDB(responses){
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.clear();
    for (const r of responses) store.put(r);
    return new Promise((resolve) => { tx.oncomplete = () => resolve(true); tx.onerror = () => resolve(false); });
  } catch(e){ return false; }
}

function checkStorageQuota(){
  try {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const val = localStorage.getItem(key);
      total += (key.length + val.length) * 2;
    }
    const limit = 5 * 1024 * 1024;
    const pct = (total / limit) * 100;
    if (pct > 80) toast('Almacenamiento casi lleno (' + Math.round(pct) + '%). Exporta tus datos para no perderlos.');
    return pct;
  } catch(e){ return 0; }
}

let responses = [];
let sheetsUrl = '';
let current = {};
let stepIndex = 0;
let charts = {};

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function saveDraft(){
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(current)); }catch(e){}
}

function loadDraft(){
  try{
    const raw = localStorage.getItem(DRAFT_KEY);
    if(raw){ current = JSON.parse(raw); return true; }
  }catch(e){}
  return false;
}

function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}

const GLOBAL_CODES = {recepcion:'VG', habitacion:'VH', desayuno:'VD', restaurante:'VR', bar:'VB', zonas:'VA', animacion:'Av'};

let _filterFrom = '';
let _filterTo = '';

function getFilterDates(){
  return { from: _filterFrom, to: _filterTo };
}

function setFilterDates(fromDate, toDate){
  _filterFrom = fromDate || '';
  _filterTo = toDate || '';
}

function inRange(fechaStr, range){
  const d = new Date(fechaStr);
  if(!range){
    const { from, to } = getFilterDates();
    if(from && to){
      const fd = new Date(from);
      const td = new Date(to);
      td.setHours(23,59,59,999);
      return d >= fd && d <= td;
    }
    return true;
  }
  const now = new Date();
  if(range === 'week'){
    const past = new Date(now); past.setDate(now.getDate()-6);
    return d >= stripTime(past) && d <= stripTime(now, true);
  }
  if(range === 'month'){
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }
  return true;
}

function stripTime(d, end){ const x = new Date(d); x.setHours(end ? 23 : 0, end ? 59 : 0, 0, 0); return x; }

function pctFromAvg(avg){ if(avg===null||isNaN(avg)) return null; return Math.round(((5-avg)/4)*1000)/10; }

function globalSatisfaction(list){
  let sum=0,n=0;
  list.forEach(r=>{
    Object.entries(GLOBAL_CODES).forEach(([sec,code])=>{
      const v = r.ratings[sec+'_'+code];
      if(v){ sum+=v; n++; }
    });
  });
  return n? pctFromAvg(sum/n) : null;
}
function deptSatisfaction(list, secKey){
  const code = GLOBAL_CODES[secKey];
  const vals = list.map(r=>r.ratings[secKey+'_'+code]).filter(v=>v);
  if(!vals.length) return null;
  return pctFromAvg(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function pct(count,total){ return total? Math.round((count/total)*1000)/10 : 0; }

function median(arr){
  if(!arr.length) return null;
  const s = arr.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function stdDev(arr){
  if(arr.length<2) return null;
  const avg = arr.reduce((a,b)=>a+b,0)/arr.length;
  const squareDiffs = arr.map(v=>Math.pow(v-avg,2));
  const avgSquareDiff = squareDiffs.reduce((a,b)=>a+b,0)/(arr.length-1);
  return Math.sqrt(avgSquareDiff);
}

function destroyCharts(prefix){
  Object.keys(charts).forEach(k=>{
    if(!prefix || k.startsWith(prefix)){ charts[k].destroy(); delete charts[k]; }
  });
}

  function getWeekLabel(dateStr) {

    const startOfWeek = new Date(d);
    startOfWeek.setDate(d.getDate() - d.getDay());

  }

  const weekMap = {};
  filtered.forEach(r => {
    const wk = getWeekKey(r.fecha);
    if(!weekMap[wk]) weekMap[wk] = [];
    weekMap[wk].push(r);
  });
  const weekKeys = Object.keys(weekMap).sort();
  const weekLabels = weekKeys.map(getWeekLabel);
  const weekCounts = weekKeys.map(wk => weekMap[wk].length);
  const weekSat = weekKeys.map(wk => globalSatisfaction(weekMap[wk]));

function computeAnalisisData(responses){
  const allRatings = [];
  responses.forEach(r => {
    Object.entries(r.ratings).forEach(([key, val]) => {
      if(val) allRatings.push({section: key.split('_')[0], value: val, id: r.id, fecha: r.fecha});
    });
  });

  const sectionStats = SECTIONS.map(sec => {
    const vals = allRatings.filter(r => r.section === sec.key).map(r => r.value);
    if(!vals.length) return null;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const sorted = vals.slice().sort((a, b) => a - b);
    const median = sorted.length % 2 ? sorted[Math.floor(sorted.length / 2)] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
    const variance = vals.reduce((sum, v) => sum + Math.pow(v - avg, 2), 0) / vals.length;
    const stdDev = Math.sqrt(variance);
    const dist = [1, 2, 3, 4, 5].map(v => vals.filter(x => x === v).length);
    const q1 = sorted[Math.floor(sorted.length * 0.25)] || 0;
    const q3 = sorted[Math.floor(sorted.length * 0.75)] || 0;
    return {
      key: sec.key, title: sec.title, icon: sec.icon,
      count: vals.length, avg, median, mode: [1,2,3,4,5][dist.indexOf(Math.max(...dist))], stdDev,
      satisfaction: pctFromAvg(avg), distribution: dist,
      topPct: pct(dist[0]+dist[1], vals.length),
      bottomPct: pct(dist[3]+dist[4], vals.length),
      min: sorted[0], max: sorted[sorted.length-1], q1, q3, iqr: q3 - q1, variance
    };
  }).filter(Boolean);

  const sectionStatsByAvg = sectionStats.slice().sort((a, b) => b.satisfaction - a.satisfaction);
  const allVals = allRatings.map(r => r.value);
  const globalAvg = allVals.length ? allVals.reduce((a, b) => a + b, 0) / allVals.length : 0;
  const globalSorted = allVals.slice().sort((a, b) => a - b);
  const globalMedian = globalSorted.length ? (globalSorted.length % 2 ? globalSorted[Math.floor(globalSorted.length / 2)] : (globalSorted[globalSorted.length / 2 - 1] + globalSorted[globalSorted.length / 2]) / 2) : 0;

  const byDate = {};
  responses.forEach(r => {
    if(!byDate[r.fecha]) byDate[r.fecha] = [];
    byDate[r.fecha].push(r);
  });
  const dates = Object.keys(byDate).sort();
  const dailyAvgs = dates.map(d => {
    const dayRatings = [];
    byDate[d].forEach(r => Object.values(r.ratings).forEach(v => { if(v) dayRatings.push(v); }));
    return dayRatings.length ? dayRatings.reduce((a,b) => a+b, 0) / dayRatings.length : null;
  }).filter(v => v !== null);
  const trend = dailyAvgs.length >= 2 ? (dailyAvgs[dailyAvgs.length - 1] - dailyAvgs[0]) : 0;

  const byRoom = {};
  responses.forEach(r => {
    if(r.habitacion) {
      if(!byRoom[r.habitacion]) byRoom[r.habitacion] = [];
      byRoom[r.habitacion].push(r);
    }
  });
  const roomList = Object.keys(byRoom).map(hab => {
    const roomRatings = [];
    byRoom[hab].forEach(r => Object.values(r.ratings).forEach(v => { if(v) roomRatings.push(v); }));
    const avg = roomRatings.length ? roomRatings.reduce((a,b) => a+b, 0) / roomRatings.length : 0;
    return { hab, count: byRoom[hab].length, avg, sat: pctFromAvg(avg) };
  }).filter(r => r.count > 0).sort((a, b) => b.count - a.count);

  const dayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const byDayOfWeek = {};
  dayNames.forEach(d => { byDayOfWeek[d] = { count: 0, ratings: [] }; });
  responses.forEach(r => {
    const dayName = dayNames[new Date(r.fecha).getDay()];
    byDayOfWeek[dayName].count++;
    Object.values(r.ratings).forEach(v => { if(v) byDayOfWeek[dayName].ratings.push(v); });
  });
  const dayOfWeekStats = dayNames.map(d => {
    const rd = byDayOfWeek[d];
    const avg = rd.ratings.length ? rd.ratings.reduce((a,b) => a+b, 0) / rd.ratings.length : null;
    return { day: d, count: rd.count, avg, sat: avg !== null ? pctFromAvg(avg) : null };
  });

  let expectYes = 0, expectTotal = 0, returnYes = 0, returnTotal = 0;
  const motiveCounts = { ocio: 0, trabajo: 0, otros: 0 };
  responses.forEach(r => {
    if(r.expectativas === 1) expectYes++;
    if(r.expectativas) expectTotal++;
    if(r.volveria === 1) returnYes++;
    if(r.volveria) returnTotal++;
    if(r.motivo === 1) motiveCounts.ocio++;
    else if(r.motivo === 2) motiveCounts.trabajo++;
    else if(r.motivo === 3) motiveCounts.otros++;
  });

  return { sectionStats, sectionStatsByAvg, allRatings, allVals, globalAvg, globalSat: pctFromAvg(globalAvg), globalMedian, expectYes, expectTotal, returnYes, returnTotal, motiveCounts, byDate, dates, dailyAvgs, trend, byRoom, roomList, dayOfWeekStats };
}

function computeCorrelations(responses, flatQ){
  const correlations = [];
  for(let i = 0; i < flatQ.length; i++){
    for(let j = i + 1; j < flatQ.length; j++){
      if(flatQ[i].sec.key === flatQ[j].sec.key) continue;
      const keyA = flatQ[i].sec.key + '_' + flatQ[i].q.code;
      const keyB = flatQ[j].sec.key + '_' + flatQ[j].q.code;
      const pairs = responses.map(r => ({a: r.ratings[keyA], b: r.ratings[keyB]})).filter(p => p.a && p.b);
      if(pairs.length < 3) continue;
      const avgA = pairs.reduce((s, p) => s + p.a, 0) / pairs.length;
      const avgB = pairs.reduce((s, p) => s + p.b, 0) / pairs.length;
      let num = 0, da = 0, db = 0;
      pairs.forEach(p => { num += (p.a - avgA) * (p.b - avgB); da += Math.pow(p.a - avgA, 2); db += Math.pow(p.b - avgB, 2); });
      correlations.push({ q1: flatQ[i], q2: flatQ[j], corr: (da && db) ? num / Math.sqrt(da * db) : 0, count: pairs.length });
    }
  }
  correlations.sort((a, b) => Math.abs(b.corr) - Math.abs(a.corr));
  return correlations.slice(0, 8);
}

function computeWordFreq(responses){
  const wordFreq = {};
  const stopwords = ['el','la','los','las','un','una','uno','de','del','en','es','se','que','lo','al','con','por','para','su','sus','como','pero','mas','muy','bien','todo','esta','este','han','hay','fue','ser','sin','sobre','tambien','ni','ya','e','y','a','o','no','si'];
  responses.forEach(r => {
    ['masGusto','menosGusto','sugerencias','comentarios'].forEach(f => {
      if(r[f]) {
        r[f].toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).forEach(w => {
          if(w.length > 3 && stopwords.indexOf(w) === -1) wordFreq[w] = (wordFreq[w] || 0) + 1;
        });
      }
    });
  });
  return Object.keys(wordFreq).map(w => ({ word: w, count: wordFreq[w] })).sort((a, b) => b.count - a.count).slice(0, 15);
}

function buildRecommendations(data, topCorr){
  const { sectionStatsByAvg, sectionStats, globalAvg, globalSat, globalMedian, filteredResponses, expectTotal, expectYes, returnTotal, returnYes } = data;
  const worst = sectionStatsByAvg[sectionStatsByAvg.length - 1];
  const best = sectionStatsByAvg[0];
  const r = [];
  if(worst) r.push('<li style="margin-bottom:8px;"><strong style="color:var(--coral);">Mejorar ' + worst.title + '</strong> — Satisfaccion ' + worst.satisfaction + '% (promedio ' + worst.avg.toFixed(2) + '/5). Es el area con menor puntuacion. Se recomienda realizar acciones especificas de mejora en este departamento.</li>');
  if(best) r.push('<li style="margin-bottom:8px;"><strong style="color:var(--palm);">' + best.title + ' es fortaleza</strong> — Satisfaccion ' + best.satisfaction + '% (promedio ' + best.avg.toFixed(2) + '/5). Mantener estandares y replicar buenas practicas en otros departamentos.</li>');
  if(globalSat < 60) r.push('<li style="margin-bottom:8px;"><strong style="color:var(--coral);">Atencion general</strong> — La satisfaccion global esta por debajo del 60%. Se recomienda una revision integral de todos los departamentos y procesos del hotel.</li>');
  if(returnYes && returnTotal && pct(returnYes, returnTotal) < 70) r.push('<li style="margin-bottom:8px;"><strong style="color:var(--gold);">Retencion de clientes</strong> — Solo el ' + pct(returnYes, returnTotal) + '% volveria. Implementar programa de fidelizacion, ofertas especiales para huespedes recurrentes y encuestas de seguimiento post-estancia.</li>');
  if(topCorr.length && topCorr[0].corr > 0.5) r.push('<li style="margin-bottom:8px;"><strong style="color:var(--sea);">Correlacion fuerte</strong> — "' + topCorr[0].q1.q.es + '" y "' + topCorr[0].q2.q.es + '" estan correlacionados (r=' + topCorr[0].corr.toFixed(2) + '). Mejorar uno impacta directamente al otro.</li>');
  if(globalAvg < 2.0) r.push('<li style="margin-bottom:8px;"><strong style="color:var(--palm);">Excelente desempeno</strong> — La satisfaccion promedio (' + globalAvg.toFixed(2) + '/5) indica un alto nivel de calidad. Continuar con la estrategia actual.</li>');
  else if(globalAvg > 4.0) r.push('<li style="margin-bottom:8px;"><strong style="color:var(--coral);">Desempeno critico</strong> — La satisfaccion promedio (' + globalAvg.toFixed(2) + '/5) es alarmantemente baja. Se requiere intervencion inmediata en todos los departamentos.</li>');
  const expectPct = expectTotal ? pct(expectYes, expectTotal) : 0;
  if(expectPct > 0 && expectPct < 50) r.push('<li style="margin-bottom:8px;"><strong style="color:var(--coral);">Expectativas no cumplidas</strong> — Solo el ' + expectPct + '% de huespedes considera que sus expectativas fueron cubiertas. Revisar promesas de marketing vs realidad del servicio.</li>');
  return r;
}

    if(!text) return { negative:[], positive:[] };

    generalNegative.forEach(kw => { if(lower.includes(kw)) neg.push(kw); });
    generalPositive.forEach(kw => { if(lower.includes(kw)) pos.push(kw); });

    if(!stats) return;
    const secKeys = sec.questions.map(q => sec.key + '_' + q.code);

    const deptFeedback = { negative:[], positive:[], comments:[] };
    filteredResponses.forEach(r => {
      const negText = r.menosGusto || '';
      const posText = r.masGusto || '';
      const sugText = r.sugerencias || '';
      const comText = r.comentarios || '';

      const posAnalysis = analyzeText(posText + ' ' + comText);

    stats.distribution.forEach((count, idx) => {

    const debilidades = Object.entries(sortedSpecificNeg).slice(0,3);
    const fortalezas = Object.entries(sortedSpecificPos).slice(0,3);

    if(debilidades.length > 0){
      html += '<div style="margin-bottom:10px;"><div style="font-size:.78rem;font-weight:600;color:var(--coral);margin-bottom:6px;">⚠️ Debilidades Detectadas:</div><div style="display:flex;flex-wrap:wrap;gap:4px;">';
      debilidades.forEach(([kw, count]) => {
        html += '<span style="font-size:.72rem;background:var(--coral);color:#fff;padding:3px 8px;border-radius:12px;">'+kw+' ('+count+')</span>';
      });
      html += '</div></div>';
    }

    if(fortalezas.length > 0){
      html += '<div style="margin-bottom:10px;"><div style="font-size:.78rem;font-weight:600;color:var(--palm);margin-bottom:6px;">✅ Fortalezas Identificadas:</div><div style="display:flex;flex-wrap:wrap;gap:4px;">';
      fortalezas.forEach(([kw, count]) => {
        html += '<span style="font-size:.72rem;background:var(--palm);color:#fff;padding:3px 8px;border-radius:12px;">'+kw+' ('+count+')</span>';
      });
      html += '</div></div>';
    }

    const recommendations = [];
    if(stats.avg <= 2.0) recommendations.push({text:'Excelente desempeño. Mantener estándares actuales y reconocer al personal.', priority:'Baja'});
    else if(stats.avg <= 3.0) recommendations.push({text:'Desempeño aceptable. Establecer protocolos y checklist de calidad para mejorar.', priority:'Media'});
    else if(stats.avg <= 4.0) recommendations.push({text:'Desempeño mejorable. Capacitar al personal y revisar procesos del departamento.', priority:'Alta'});
    else recommendations.push({text:'Desempeño crítico. Intervención inmediata: capacitación intensiva y revisión de estándares.', priority:'Alta'});
    if(stats.stdDev > 1.2) recommendations.push({text:'Alta variabilidad en respuestas. Estandarizar procesos y capacitar personal inconsistente.', priority:'Alta'});
    if(sortedSpecificNeg.length > 0){
      const topNeg = sortedSpecificNeg[0][0];
      if(topNeg.includes('comida') || topNeg.includes('buffet')) recommendations.push({text:'Revisar calidad y variedad gastronómica. Implementar controles de calidad.', priority:'Alta'});
      if(topNeg.includes('wifi') || topNeg.includes('internet')) recommendations.push({text:'Invertir en infraestructura de internet. Ampliar cobertura y velocidad.', priority:'Alta'});
      if(topNeg.includes('personal') || topNeg.includes('trato')) recommendations.push({text:'Capacitar al personal en servicio al cliente. Implementar protocolo de atención.', priority:'Alta'});
      if(topNeg.includes('piscina') || topNeg.includes('playa')) recommendations.push({text:'Mejorar mantenimiento de áreas comunes. Aumentar limpieza y dotación.', priority:'Media'});
      if(topNeg.includes('limpieza') || topNeg.includes('suciedad')) recommendations.push({text:'Aumentar frecuencia de limpieza. Asignar personal dedicado por zona.', priority:'Alta'});
      if(topNeg.includes('musica') || topNeg.includes('ruido')) recommendations.push({text:'Ajustar niveles de sonido y horarios de entretenimiento.', priority:'Media'});
      if(topNeg.includes('toldos') || topNeg.includes('tumbonas')) recommendations.push({text:'Incrementar dotación de toldos, tumbonas y sillas en áreas de descanso.', priority:'Media'});
      if(topNeg.includes('agua caliente') || topNeg.includes('fria')) recommendations.push({text:'Revisar sistema de agua caliente. Priorizar reparación de calentadores.', priority:'Alta'});
    }

    html += '<div style="margin-bottom:8px;"><div style="font-size:.78rem;font-weight:600;color:var(--sea-deep);margin-bottom:6px;">📋 Recomendaciones:</div><ul style="margin:0;padding-left:18px;font-size:.8rem;color:var(--ink);line-height:1.5;">';
    recommendations.forEach(a => {
      const pColor = a.priority==='Alta'?'var(--coral)':a.priority==='Media'?'var(--gold)':'var(--palm)';
      html += '<li style="margin-bottom:5px;">'+a.text+' <span style="display:inline-block;font-size:.65rem;font-weight:600;color:'+pColor+';background:'+pColor+'15;padding:1px 6px;border-radius:4px;margin-left:4px;">'+a.priority+'</span></li>';
    });
    html += '</ul></div></div>';
  });

  html += '</div>';
  return html;
}

      datasets: [
        {label:'Muy Bueno (1)', data:sectionStatsByAvg.map(s => s.distribution[0]), backgroundColor:'#4C7A63', borderRadius:3},
        {label:'Bueno (2)', data:sectionStatsByAvg.map(s => s.distribution[1]), backgroundColor:'#8FAE6B', borderRadius:3},
        {label:'Regular (3)', data:sectionStatsByAvg.map(s => s.distribution[2]), backgroundColor:'#D9A441', borderRadius:3},
        {label:'Deficiente (4)', data:sectionStatsByAvg.map(s => s.distribution[3]), backgroundColor:'#E8622C', borderRadius:3},
        {label:'Muy deficiente (5)', data:sectionStatsByAvg.map(s => s.distribution[4]), backgroundColor:'#C94E1E', borderRadius:3}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,title:{display:true,text:'Respuestas'}}},
      plugins:{legend:{position:'bottom'}}
    }
  });

  function getWeekKeyA(dateStr) {
    const d = new Date(dateStr);
    const startOfWeek = new Date(d);
    startOfWeek.setDate(d.getDate() - d.getDay());
    return startOfWeek.toISOString().slice(0,10);
  }
  function getWeekLabelA(dateStr) {
    const d = new Date(dateStr);
    const startOfWeek = new Date(d);
    startOfWeek.setDate(d.getDate() - d.getDay());
    const endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(startOfWeek.getDate() + 6);
    const s = (startOfWeek.getMonth()+1)+'/'+startOfWeek.getDate();
    const e = (endOfWeek.getMonth()+1)+'/'+endOfWeek.getDate();
    return s+'-'+e;
  }

  const weekMapA = {};
  filteredResponses.forEach(r => {
    const wk = getWeekKeyA(r.fecha);
    if(!weekMapA[wk]) weekMapA[wk] = [];
    weekMapA[wk].push(r);
  });
  const weekKeysA = Object.keys(weekMapA).sort();
  const trendWeeks = weekKeysA.map(getWeekLabelA);
  const trendAvgs = weekKeysA.map(wk => {
    const wkRatings = [];
    weekMapA[wk].forEach(r => Object.values(r.ratings).forEach(v => { if(v) wkRatings.push(v); }));
    return wkRatings.length ? wkRatings.reduce((a,b) => a+b, 0) / wkRatings.length : null;
  });

  charts.analisis_trend = new Chart(document.getElementById('chart_analisis_trend'), {
    type:'line',
    data:{
      labels: trendWeeks,
      datasets:[{
        label:'Promedio semanal', data:trendAvgs, borderColor:'#0F4C4A',
        backgroundColor:'rgba(15,76,74,0.1)', fill:true, tension:.3, spanGaps:true,
        pointRadius:4, pointBackgroundColor:'#E8622C'
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{y:{min:1,max:5,title:{display:true,text:'Promedio (1-5)'}}},
      plugins:{
        legend:{position:'bottom'},
        tooltip:{
          callbacks:{
            label: function(ctx){ return 'Promedio: '+ctx.parsed.y.toFixed(2)+'/5'; }
          }
        }
      }
    }
  });

  charts.analisis_motive = new Chart(document.getElementById('chart_analisis_motive'), {
    type:'doughnut',
    data:{
      labels:['Ocio','Trabajo','Otros'],
      datasets:[{ data:[motiveCounts.ocio, motiveCounts.trabajo, motiveCounts.otros], backgroundColor:['#4C7A63','#0F4C4A','#D9A441'], borderWidth:2, borderColor:'#fff' }]
    },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
  });
}

let modalChart = null;

function openChartModal(canvasId, title){
  const existing = document.getElementById('chartModalOverlay');
  if(existing) existing.remove();
  if(modalChart){ modalChart.destroy(); modalChart = null; }

  const overlay = document.createElement('div');
  overlay.className = 'chart-modal-overlay';
  overlay.id = 'chartModalOverlay';
  overlay.innerHTML = '<div class="chart-modal"><button class="chart-modal-close" onclick="closeChartModal()">&times;</button><h3>'+title+'</h3><canvas id="chartModalCanvas"></canvas></div>';
  overlay.addEventListener('click', e => { if(e.target === overlay) closeChartModal(); });
  document.body.appendChild(overlay);

  const srcChart = charts[canvasId];
  if(!srcChart) return;

  modalChart = new Chart(document.getElementById('chartModalCanvas'), {
    type:'doughnut',
    data: JSON.parse(JSON.stringify(srcChart.data)),
    options:{ responsive:true, maintainAspectRatio:true, cutout:'40%',
      plugins:{legend:{position:'right',labels:{boxWidth:14,padding:10,font:{size:13}}},
        tooltip:{callbacks:{
          title:(c)=>RATE_LABELS[parseInt(c[0].label)]||c[0].label,
          label:(c)=>{
            const total = c.dataset.data.reduce((a,b)=>a+b,0);
            return c.raw+' respuesta(s) ('+(total?Math.round(c.raw/total*100):0)+'%)';
          }
        }}
      }
    }
  });
}

function closeChartModal(){
  const overlay = document.getElementById('chartModalOverlay');
  if(overlay) overlay.remove();
  if(modalChart){ modalChart.destroy(); modalChart = null; }
}

async function handleImportJSON(file){
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const incoming = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.responses) ? parsed.responses : null);
    if(!incoming) throw new Error('formato inválido');
    const existingIds = new Set(responses.map(r=>r.id));
    let added = 0;
    incoming.forEach(r=>{
      if(!r || typeof r!=='object') return;
      if(!r.id) r.id = 'r'+Date.now()+Math.random().toString(36).slice(2,7);
      if(existingIds.has(r.id)) return;
      existingIds.add(r.id);
      responses.push(r);
      added++;
    });
    await saveResponses();
    renderDatos();
    toast(`${added} respuesta(s) importada(s) del respaldo`);
  }catch(e){
    toast('El archivo .json no tiene un formato válido');
  }
}

function normalizeHeader(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
async function handleImportExcel(file){
  if(!file) return;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});

    const flatQ = [];
    SECTIONS.forEach(s=>s.questions.forEach(q=>flatQ.push({sec:s,q})));

    let sheetName = '', ws = null, rows = [];
    const codeToFind = flatQ[0]?.q?.code;
    for(const sn of wb.SheetNames){
      const candidate = wb.Sheets[sn];
      const testRows = XLSX.utils.sheet_to_json(candidate, {header:1, raw:true, defval:''});
      const hasCode = testRows.some(r => r.some(c => String(c).trim()===codeToFind));
      if(hasCode || sn==='Datos'){ sheetName = sn; ws = candidate; rows = testRows; break; }
    }
    if(!ws){ sheetName = wb.SheetNames[0]; ws = wb.Sheets[sheetName]; rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''}); }

    const added = processImportRows(rows);
    if(added===0) return;
    await saveResponses();
    renderDatos();
    alert(`Importadas: ${added} desde Excel\nHoja: "${sheetName}"`);
  }catch(e){
    toast('No se pudo leer el Excel: ' + e.message);
  }
}

async function handleImportCSV(file){
  if(!file) return;
  try{
    const text = await file.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const sep = lines[0].includes(';') ? ';' : ',';
    const rows = lines.map(l => l.split(sep));
    const added = processImportRows(rows);
    if(added===0) return;
    await saveResponses();
    renderDatos();
    alert(`Importadas: ${added} desde CSV\nFilas: ${rows.length}`);
  }catch(e){
    toast('No se pudo leer el CSV: ' + e.message);
  }
}

function processImportRows(rows){
  const flatQ = [];
  SECTIONS.forEach(s=>s.questions.forEach(q=>flatQ.push({sec:s,q})));

  let codeRow = -1, ratingStart = -1;
  for(let r=0; r<Math.min(rows.length,10); r++){
    const row = rows[r];
    if(!row) continue;
    const idx = row.findIndex(c => String(c).trim() === flatQ[0].q.code);
    if(idx>-1){ codeRow = r; ratingStart = idx; break; }
  }
  if(codeRow===-1){ toast('No se encontró la fila de códigos (VG, AP, Es...)'); return 0; }

  const headerRows = rows.slice(0, codeRow+1);
  const numCols = Math.max(...rows.map(r=>r.length));
  const headerText = [];
  for(let c=0;c<numCols;c++){
    headerText[c] = headerRows.map(r=>normalizeHeader(r[c])).join(' ');
  }
  function findCol(pred, excludeCols){
    for(let c=0;c<numCols;c++){
      if(excludeCols && excludeCols.has(c)) continue;
      if(pred(headerText[c])) return c;
    }
    return -1;
  }
  const ratingCols = new Set();
  for(let i=0;i<flatQ.length;i++) ratingCols.add(ratingStart+i);

  const colNombre = findCol(h=>h.includes('nombre') && !h.includes('apellid'), ratingCols);
  const colApellidos = findCol(h=>h.includes('apellid'), ratingCols);
  const colFecha = findCol(h=>h.includes('fecha'), ratingCols);
  const colHab = findCol(h=>h.includes('hab'), ratingCols);
  const colEmail = findCol(h=>h.includes('mail'), ratingCols);
  const colExpect = findCol(h=>h.includes('expectativ'), ratingCols);
  const colVolver = findCol(h=>h.includes('volver'), ratingCols);
  const colMotivo = findCol(h=>h.includes('motivo') && !h.includes('especific'), ratingCols);
  const colEspecificar = findCol(h=>h.includes('especific'), ratingCols);
  const colMas = findCol(h=>h.includes('gustado') && !h.includes('menos'), ratingCols);
  const colMenos = findCol(h=>h.includes('menos'), ratingCols);
  const colSugerencias = findCol(h=>h.includes('sugerenc'), ratingCols);
  const colComentarios = findCol(h=>h.includes('coment'), ratingCols);

  function toRating(v){ const n=parseInt(v); return (n>=1&&n<=5)? n : null; }
  function toYesNo(v){
    const s = normalizeHeader(v);
    if(s==='1'||s==='si'||s==='sí') return 1;
    if(s==='2'||s==='no') return 2;
    return null;
  }
  function toMotivo(v){
    const s = normalizeHeader(v);
    if(s==='1'||s.includes('ocio')) return 1;
    if(s==='2'||s.includes('trabajo')) return 2;
    if(s==='3'||s.includes('otro')) return 3;
    return null;
  }
  function dateToISO(v){
    if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
    if(typeof v==='string' && v.trim()){
      const d = new Date(v);
      if(!isNaN(d)) return d.toISOString().slice(0,10);
    }
    return todayISO();
  }

  const existingIds = new Set(responses.map(r=>r.id));
  let added = 0, skippedEmpty = 0, skippedDuplicate = 0;
  for(let r=codeRow+1; r<rows.length; r++){
    const row = rows[r];
    if(!row || row.every(c=>c==='' || c===undefined || c===null)){ skippedEmpty++; continue; }
    let hasRating = false;
    flatQ.forEach((x,i) => { if(toRating(row[ratingStart+i])) hasRating = true; });
    if(!hasRating){ skippedEmpty++; continue; }
    const ratings = {};
    flatQ.forEach((x,i)=>{
      const val = toRating(row[ratingStart+i]);
      if(val) ratings[x.sec.key+'_'+x.q.code] = val;
    });
    const rec = {
      id: 'imp'+Date.now()+Math.random().toString(36).slice(2,7)+'_'+r,
      fecha: colFecha>-1 ? dateToISO(row[colFecha]) : todayISO(),
      nombre: colNombre>-1 ? String(row[colNombre]||'') : '',
      apellidos: colApellidos>-1 ? String(row[colApellidos]||'') : '',
      habitacion: colHab>-1 ? String(row[colHab]||'') : '',
      email: colEmail>-1 ? String(row[colEmail]||'') : '',
      ratings,
      expectativas: colExpect>-1 ? toYesNo(row[colExpect]) : null,
      volveria: colVolver>-1 ? toYesNo(row[colVolver]) : null,
      motivo: colMotivo>-1 ? toMotivo(row[colMotivo]) : null,
      motivoOtro: colEspecificar>-1 ? String(row[colEspecificar]||'') : '',
      masGusto: colMas>-1 ? String(row[colMas]||'') : '',
      menosGusto: colMenos>-1 ? String(row[colMenos]||'') : '',
      sugerencias: colSugerencias>-1 ? String(row[colSugerencias]||'') : '',
      comentarios: colComentarios>-1 ? String(row[colComentarios]||'') : ''
    };
    if(existingIds.has(rec.id)){ skippedDuplicate++; continue; }
    existingIds.add(rec.id);
    responses.push(rec);
    added++;
  }
  if(added===0){ toast('No se encontraron filas de datos. Revisa que el archivo tenga calificaciones (1-5) en las columnas correctas.'); return 0; }
  if(skippedEmpty>0) toast(`${added} importadas (${skippedEmpty} filas vacias/sin rating omitidas)`);
  else toast(`${added} respuesta(s) importada(s)`);
  return added;
}

function saveSheetsUrlFromInput(){
  const url = document.getElementById('sheetsUrlInput').value.trim();
  const ok = saveSheetsUrl(url);
  if(ok){ toast(url ? 'URL guardada' : 'Conexión desactivada'); renderDatos(); }
  else toast('No se pudo guardar la URL');
}

function buildSheetPayload(r){
  const flatQ = [];
  SECTIONS.forEach(s=>s.questions.forEach(q=>flatQ.push({sec:s,q})));
  return {
    id: r.id, fecha: r.fecha, nombre: r.nombre, apellidos: r.apellidos,
    habitacion: r.habitacion, email: r.email,
    ratingsArray: flatQ.map(x=> r.ratings[x.sec.key+'_'+x.q.code] || ''),
    ratings: r.ratings,
    expectativas: r.expectativas===1?'Sí':r.expectativas===2?'No':'',
    volveria: r.volveria===1?'Sí':r.volveria===2?'No':'',
    motivo: r.motivo===1?'Ocio':r.motivo===2?'Trabajo':r.motivo===3?'Otros':'',
    motivoOtro: r.motivoOtro, masGusto: r.masGusto, menosGusto: r.menosGusto,
    sugerencias: r.sugerencias, comentarios: r.comentarios
  };
}

async function pushResponseToSheet(r){
  if(!sheetsUrl) return;
  try{
    await fetch(sheetsUrl, {method:'POST', body: JSON.stringify(buildSheetPayload(r))});
  }catch(e){
    console.warn('No se pudo enviar a Google Sheets', e);
  }
}

async function syncAllToSheet(){
  if(!sheetsUrl){ toast('Primero guarda la URL de tu Apps Script'); return; }
  showLoading('Sincronizando con Google Sheets...');
  let ok=0;
  for(const r of responses){
    try{ await fetch(sheetsUrl, {method:'POST', body: JSON.stringify(buildSheetPayload(r))}); ok++; }
    catch(e){}
  }
  hideLoading();
  toast(`${ok} de ${responses.length} respuesta(s) sincronizada(s)`);
}

async function pullFromSheet(){
  if(!sheetsUrl){ toast('Primero guarda la URL de tu Apps Script'); return; }
  showLoading('Trayendo datos desde Google Sheets...');
  try{
    const res = await fetch(sheetsUrl);
    const data = await res.json();
    const existingIds = new Set(responses.map(r=>r.id));
    let added = 0;
    data.forEach(d=>{
      if(!d.id || existingIds.has(d.id)) return;
      existingIds.add(d.id);
      responses.push({
        id: d.id, fecha: d.fecha || todayISO(), nombre: d.nombre||'', apellidos: d.apellidos||'',
        habitacion: d.habitacion||'', email: d.email||'', ratings: d.ratings||{},
        expectativas: d.expectativas==='Sí'?1:d.expectativas==='No'?2:null,
        volveria: d.volveria==='Sí'?1:d.volveria==='No'?2:null,
        motivo: d.motivo==='Ocio'?1:d.motivo==='Trabajo'?2:d.motivo==='Otros'?3:null,
        motivoOtro: d.motivoOtro||'', masGusto: d.masGusto||'', menosGusto: d.menosGusto||'',
        sugerencias: d.sugerencias||'', comentarios: d.comentarios||''
      });
      added++;
    });
    await saveResponses();
    renderDatos();
    hideLoading();
    toast(`${added} respuesta(s) traída(s) desde Sheets`);
  }catch(e){
    hideLoading();
    toast('No se pudo conectar con Google Sheets. Revisa la URL y los permisos.');
  }
}

function yearOverYearComparison(filteredResponses){
  if(!filteredResponses.length) return { lastYear: null };
  const dates = filteredResponses.map(r => new Date(r.fecha)).filter(d => !isNaN(d));
  if(!dates.length) return { lastYear: null };
  const minDate = new Date(Math.min(...dates));
  const maxDate = new Date(Math.max(...dates));
  const prevMin = new Date(minDate); prevMin.setFullYear(prevMin.getFullYear()-1);
  const prevMax = new Date(maxDate); prevMax.setFullYear(prevMax.getFullYear()-1);
  const prevYearRes = responses.filter(r => {
    const d = new Date(r.fecha);
    return d >= prevMin && d <= prevMax;
  });
  if(!prevYearRes.length) return { lastYear: null };

  function calcStats(list){
    const vals = [];
    list.forEach(r => Object.values(r.ratings||{}).forEach(v => { if(v) vals.push(v); }));
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    return { count: list.length, avg, sat: pctFromAvg(avg) };
  }

  return {
    lastYear: {
      current: calcStats(filteredResponses),
      previous: calcStats(prevYearRes)
    }
  };
}

function exportFullReport(){
  const txt = responses.map(r => {
    const ratingsStr = Object.entries(r.ratings).map(([k,v])=>`${k}:${v}`).join(', ');
    return `ID:${r.id} | Fecha:${r.fecha} | Nombre:${r.nombre} ${r.apellidos} | Hab:${r.habitacion} | Email:${r.email} | Ratings:{${ratingsStr}} | Expectativas:${r.expectativas===1?'Sí':r.expectativas===2?'No':'—'} | Volvería:${r.volveria===1?'Sí':r.volveria===2?'No':'—'} | Motivo:${r.motivo===1?'Ocio':r.motivo===2?'Trabajo':r.motivo===3?'Otros':'—'} | +:${r.masGusto} | -:${r.menosGusto} | Sug:${r.sugerencias} | Coment:${r.comentarios}`;
  }).join('\n');
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'informe-completo-hesperia-'+todayISO()+'.txt';
  a.click();
  toast('Informe completo exportado');
}

function editResponse(id){
  const r = responses.find(x => x.id === id);
  if(!r) return;
  if(!confirm('¿Editar esta respuesta? Se cargará en el formulario y podrá modificarla.')) return;
  loadResponseIntoWizard(r);
  document.getElementById('mainTabs').querySelector('[data-tab="encuesta"]').click();
  toast('Respuesta cargada para editar. Al reenviar se añadirá como nueva.');
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

(async function init(){
  await loadResponses();
  loadSheetsUrl();
  setupWizardDelegation();
  renderWizard();
})();
